[package]
name = "graphest"
version = "1.8.2"
authors = ["Masashi Mizuno"]
edition = "2021"
repository = "https://github.com/unageek/graphest"
license = "MIT"
publish = false
default-run = "graph"

[features]
default = ["arb"]
arb = ["graphest-flint-sys"]

[dependencies]
bitflags = "2.3"
inari = "2.0"
itertools = "0.15"
nom = "8.0"

[dependencies.clap]
version = "4.3"
default-features = false
features = ["error-context", "help", "std", "usage"]

[dependencies.gmp-mpfr-sys]
version = "1.7"
default-features = false
features = ["mpfr"]

[dependencies.graphest-fftw-sys]
path = "graphest-fftw-sys"

[dependencies.graphest-flint-sys]
path = "graphest-flint-sys"
optional = true

[dependencies.image]
version = "0.25"
default-features = false
features = ["png"]

[dependencies.rug]
version = "1.30"
default-features = false
features = ["float", "integer", "rational"]

[dependencies.smallvec]
version = "1.10"
features = ["specialization"]

[dev-dependencies.uuid]
version = "1.2"
default-features = false

[lib]
doctest = false

[[bin]]
name = "compose"
doc = false
test = false

[[bin]]
name = "concatenate"
doc = false
test = false

[[bin]]
name = "graph"
doc = false
